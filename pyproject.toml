[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "phasecon"
version = "0.0.1"
description = "PhaseCon-Net: neural-vocoder phase-discrepancy deepfake audio detector"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# Real errors only: syntax (E9), statement-level (E4, E7), pyflakes (F).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
