data:
  root: data/raw/LibriSeVoc
  # Official split files ship with the baseline repo; copy them to data/splits/ (step A2)
  split_files:
    train: data/splits/train.txt
    dev: data/splits/dev.txt
    test: data/splits/test.txt
  # Label convention used INSIDE this repo: 0 = bona fide, 1 = synthetic.
  # The baseline wrapper converts to/from the baseline's own convention.
  # vocoder_id: 0 = bona fide (folder gt), 1..6 = the folders below, in this order.
  # Order matches the released baseline's vocoder head (eval.py); see docs/DATASET_NOTES.md section 3.
  vocoders: [wavegrad, diffwave, parallel_wave_gan, wavernn, wavenet, melgan]
  subset:                 # balanced subset (PR-09, DATASET_NOTES.md section 9)
    enabled: false        # true = train/dev read data/subsets/<split>.txt
    per_vocoder_train: 1000   # 6,000 utterances -> 12,000 clips (6,000 real + 1,000 per vocoder)
    per_vocoder_dev: 200      # 1,200 utterances -> 2,400 clips
    per_vocoder_test: null    # null = always report on the FULL official test split
    manifest_dir: data/subsets
  num_workers: 4
  lovo:                   # leave-one-vocoder-out (PR-13, DATASET_NOTES.md section 10)
    held_out: null        # a name from `vocoders` -> loader reads data/splits/lovo/<name>/<split>.txt
    split_dir: data/splits/lovo
